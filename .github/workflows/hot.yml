name: 热股榜更新
on:
  schedule:
    # A股盘中 北京时间9:00-15:59 每10分钟
    - cron: "*/10 1-7 * * 1-5"
    # 收盘后 北京时间16:00-22:59 每30分钟(人气/热度在收盘后仍会变动)
    - cron: "*/30 8-14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓取热股榜数据
        run: python scripts/hot_stocks.py
      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: 热股榜更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
