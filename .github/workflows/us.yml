name: 美股板块更新
on:
  schedule:
    # 美东时段(冬令时盘前17:00北京时间起, 盘后次日09:00止) => UTC 08:00-次日01:50
    - cron: "*/10 8-23 * * 1-5"
    - cron: "*/10 0-1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install tzdata
      - name: 抓取美股板块数据
        run: python scripts/us_sectors.py
      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: 美股更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
